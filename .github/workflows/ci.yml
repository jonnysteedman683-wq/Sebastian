name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          sudo apt-get install -y -q bubblewrap || true  # sandbox tests skip if unusable
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev,anthropic,watch]" pip-audit
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test (coverage gate 90%)
        run: pytest --cov --cov-report=term-missing
      - name: Offline evals (capability + prompt injection)
        run: python -m sebastian.evals
      - name: Offline end-to-end demo
        run: mkdir -p /tmp/ws && python -m sebastian demo -w /tmp/ws
      - name: watchkit smoke (canary from this checkout)
        env:
          WATCHER_HMAC_KEY: ci-smoke-key-not-a-secret
        run: sebastian-watch canary --seq 1 --ref HEAD > /tmp/canary.json && sebastian-watch verify /tmp/canary.json --expect-seq 1
      - name: Dependency audit
        run: pip-audit --skip-editable
