name: Watch

# Runs the repo watcher (docs/watch/RUNBOOK.md) unattended. Keyless by default:
#   scan -> report (mechanical draft, SHA-256 fingerprint) -> commit latest.json,
#   reports/<seq>.json and state.json to the `watch-state` branch in one commit.
# Bots read https://raw.githubusercontent.com/<owner>/<repo>/watch-state/latest.json.
# Optional push mode: set COORDINATOR_URL (+ WATCHER_HMAC_KEY, GROK_DRAFT_URL) secrets.

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"     # hourly change check (off the hour to avoid queue spikes)
    - cron: "0 22 * * *"    # daily digest: 08:00 Australia/Brisbane
    - cron: "15 22 * * 0"   # weekly canary: Monday 08:15 Australia/Brisbane
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        options: [change, digest, canary]
        default: change
      baseline_sha:
        description: "Start SHA for the very first report (default: previous commit)"
        required: false
      dry_run:
        description: "Build the report only; publish nothing"
        type: boolean
        default: false

permissions:
  contents: write  # only used to update the watch-state branch

concurrency:
  group: sebastian-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install watchkit
        run: python -m pip install -e ".[watch]"

      - name: Open watch-state branch
        run: |
          wt="$RUNNER_TEMP/watch-state"
          if git ls-remote --exit-code --heads origin watch-state >/dev/null; then
            git fetch --quiet origin watch-state
            git worktree add -B watch-state "$wt" origin/watch-state
          else
            git worktree add --orphan -b watch-state "$wt"
          fi
          echo "WT=$wt" >> "$GITHUB_ENV"

      - name: Pick mode
        id: mode
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          case "$SCHEDULE" in
            "15 22 * * 0") mode=canary ;;
            "0 22 * * *")  mode=digest ;;
            *)             mode="${INPUT_MODE:-change}" ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Run watcher
        env:
          # All optional. Unset = keyless publish to the watch-state branch.
          WATCHER_HMAC_KEY: ${{ secrets.WATCHER_HMAC_KEY }}
          COORDINATOR_URL: ${{ secrets.COORDINATOR_URL }}
          COORDINATOR_TOKEN: ${{ secrets.COORDINATOR_TOKEN }}
          GROK_DRAFT_URL: ${{ secrets.GROK_DRAFT_URL }}
          GROK_DRAFT_TOKEN: ${{ secrets.GROK_DRAFT_TOKEN }}
          BASELINE: ${{ inputs.baseline_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # First ever run: start from the previous commit so the first report covers only
          # the latest change, not every capability Sebastian already has.
          if [ ! -f "$WT/state.json" ] && [ -z "$BASELINE" ]; then
            BASELINE=$(git rev-parse origin/main~1)
          fi
          extra=()
          if [ -n "$BASELINE" ]; then extra+=(--baseline "$BASELINE"); fi
          if [ "$DRY_RUN" = "true" ]; then extra+=(--dry-run); fi
          sebastian-watch run \
            --state "$WT/state.json" \
            --publish-dir "$WT" \
            --mode "${{ steps.mode.outputs.mode }}" \
            --ref origin/main \
            --out "$RUNNER_TEMP/report.json" \
            "${extra[@]}" | tee "$RUNNER_TEMP/summary.json"

      - name: Publish to watch-state
        if: always()
        run: |
          cd "$WT"
          if [ ! -f README.md ]; then
            cat > README.md <<'MD'
          # watch-state

          Written only by `.github/workflows/watch.yml`. Do not edit.

          - `latest.json`: newest report (schema: `schemas/repo_change_report.schema.json` on `main`)
          - `reports/NNNNNN.json`: every report, by sequence number
          - `state.json`: watcher position (`last_reported_sha`, `seq`, ...)

          Readers: fetch `latest.json` from the raw URL and run `sebastian-watch verify`.
          MD
          fi
          git add -A
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git config user.name "sebastian-watch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          seq=$(python -c "import json;print(json.load(open('state.json'))['seq'])" 2>/dev/null || echo "?")
          git commit -q -m "watch: report seq $seq"
          git push --quiet origin watch-state

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: watch-report-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/report.json
            ${{ runner.temp }}/summary.json
          if-no-files-found: ignore
          retention-days: 30
