name: Live evals

# Runs the eval suite (capability + prompt-injection) against the real model.
# Needs the ANTHROPIC_API_KEY repository secret; without it the job is skipped.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model ID (blank = SEBASTIAN_MODEL default)"
        required: false
      min_score:
        description: "Fail below this score (0-1)"
        required: false
        default: "0.8"
  schedule:
    - cron: "30 21 * * 0"  # Mon 07:30 Brisbane

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check secret
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY not set; skipping live evals." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-python@v7
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.13"
      - name: Install
        if: steps.key.outputs.present == 'true'
        run: python -m pip install -e ".[anthropic]"
      - name: Run live evals
        if: steps.key.outputs.present == 'true'
        env:
          MODEL: ${{ inputs.model }}
          MIN_SCORE: ${{ inputs.min_score || '0.8' }}
        run: |
          args=(--live --min-score "$MIN_SCORE")
          if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          python -m sebastian.evals "${args[@]}" | tee evals.txt
          { echo '```'; cat evals.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
