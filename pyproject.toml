[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sebastian"
version = "0.1.0"
description = "Sebastian: an autonomous, sandboxed, gated tool-using agent."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jonny" }]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=1.15"]
watch = ["jsonschema>=4.26"]
dev = ["ruff>=0.17", "mypy>=2.4", "pytest>=9.0", "pytest-cov>=6.0", "jsonschema>=4.26", "types-jsonschema"]

[project.scripts]
sebastian = "sebastian.cli:main"
sebastian-watch = "sebastian.watch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sebastian"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PL", "PT", "RET", "ARG", "D1"]
ignore = [
    "PLR0913",  # explicit constructor injection is the design
    "PLR0917",
    "PLR2004",
    "S603",     # subprocess use is deliberate and sandboxed (tools/builtin.py)
    "ARG002",   # protocol implementations legitimately ignore arguments
    "D105",     # magic methods are self-describing
    "D107",     # __init__ is documented on its class
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "S108", "S311", "PLC0415", "PLR2004", "ARG", "D1"]
"scripts/**" = ["D1"]
"src/sebastian/watch/**" = ["D1"]  # guarded path; docstrings there need an owner-approved PR

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["eval: offline eval suite (sebastian.evals); run alone with -m eval"]

[tool.coverage.run]
source = ["sebastian"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
